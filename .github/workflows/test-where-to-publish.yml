# Temporary: tests the Where to Publish page on the where-to-publish branch.
# Renders the page and saves logs and output to the where-to-publish-test-output
# branch for review. Does not deploy, touch master or open issues.
# Delete this file before merging to master.
name: Test Where to Publish

on:
  push:
    branches:
      - where-to-publish
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R packages
        run: |
          lib <- Sys.getenv("R_LIBS_USER")
          dir.create(lib, recursive = TRUE, showWarnings = FALSE)
          install.packages(c("rmarkdown", "knitr", "httr2", "purrr", "dplyr", "tidyr",
                             "stringr", "jsonlite", "glue", "DT", "here", "readr", "xml2"),
                           lib = lib, dependencies = TRUE, Ncpus = 2L)
        shell: Rscript {0}

      - name: Run checks and render
        run: |
          mkdir -p test-output
          set +e
          Rscript R/fetch_oa_journal_data.R > test-output/01_fetch.log 2>&1; echo "exit $?" >> test-output/01_fetch.log
          cp oa_alerts.md test-output/alerts_run1.md 2>/dev/null
          rm -f oa_alerts.md
          Rscript R/fetch_oa_journal_data.R > test-output/02_fetch_again.log 2>&1; echo "exit $?" >> test-output/02_fetch_again.log
          cp oa_alerts.md test-output/alerts_run2.md 2>/dev/null
          Rscript R/check_uofg_arrangements.R > test-output/03_uofg.log 2>&1; echo "exit $?" >> test-output/03_uofg.log
          Rscript R/check_uofg_arrangements.R > test-output/04_uofg_again.log 2>&1; echo "exit $?" >> test-output/04_uofg_again.log
          quarto render oa-journals.qmd > test-output/05_render.log 2>&1; echo "exit $?" >> test-output/05_render.log
          cp -r docs test-output/docs 2>/dev/null
          cp _data/oa_journals_live.json _data/oa_alerts_state.txt _data/uofg_arrangements_snapshot.txt test-output/ 2>/dev/null
          exit 0

      - name: Save output to a review branch
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          cd test-output
          git init -q -b where-to-publish-test-output
          git add -A
          git -c user.email="github-actions[bot]@users.noreply.github.com" -c user.name="github-actions[bot]" commit -q -m "Test output ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" where-to-publish-test-output
