# Temporary: tests the Where to Publish page on the where-to-publish branch.
# Renders the page and uploads it as an artifact. Does not deploy, commit or
# open issues. Delete this file before merging to master.
name: Test Where to Publish

on:
  push:
    branches:
      - where-to-publish
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R packages
        run: |
          lib <- Sys.getenv("R_LIBS_USER")
          dir.create(lib, recursive = TRUE, showWarnings = FALSE)
          install.packages(c("rmarkdown", "knitr", "httr2", "purrr", "dplyr", "tidyr",
                             "stringr", "jsonlite", "glue", "DT", "here", "readr", "xml2"),
                           lib = lib, dependencies = TRUE, Ncpus = 2L)
        shell: Rscript {0}

      - name: Refresh open access journal data
        run: Rscript R/fetch_oa_journal_data.R

      - name: Second refresh (tests change detection and no repeat alerts)
        run: |
          rm -f oa_alerts.md
          Rscript R/fetch_oa_journal_data.R
          if [ -f oa_alerts.md ]; then echo "ALERT FILE WRITTEN ON SECOND RUN"; cat oa_alerts.md; fi

      - name: Check UofG publisher arrangements page
        run: |
          Rscript R/check_uofg_arrangements.R
          Rscript R/check_uofg_arrangements.R
          wc -l _data/uofg_arrangements_snapshot.txt || true
          head -60 _data/uofg_arrangements_snapshot.txt || true

      - name: Show alerts from first run
        run: cat oa_alerts.md || echo "No alerts file"

      - name: Render the page
        run: quarto render oa-journals.qmd

      - name: Upload rendered site and data
        uses: actions/upload-artifact@v4
        with:
          name: where-to-publish-test
          path: |
            docs/
            _data/oa_journals_live.json
            _data/oa_alerts_state.txt
            _data/uofg_arrangements_snapshot.txt
